<a class="back-link" routerLink="/recipes">
    ← Quay lại danh sách
</a>

<div class="form-card">

    <h2>📝 Thêm công thức mới</h2>

    <form [formGroup]="recipeForm" (ngSubmit)="save()" class="recipe-form">

        <div class="field">

            <label>Tên món</label>

            <input type="text" formControlName="name" placeholder="Ví dụ: Phở bò">

        </div>

        <div class="field">

            <label>Giá</label>

            <input type="number" formControlName="price" placeholder="100">

        </div>

        <div class="field">

            <label>Mô tả</label>

            <textarea rows="4" formControlName="description" placeholder="Mô tả món ăn...">
            </textarea>

        </div>

        <div class="field">

            <label>Nguyên liệu</label>

            <textarea rows="3" formControlName="ingredients" placeholder="Bò, Hành, Tiêu">
            </textarea>

        </div>

        <div class="field">

            <label>Hình ảnh (không bắt buộc)</label>

            <input type="text" formControlName="imgUrl" placeholder="https://...">

        </div>

        <button class="submit-button">
            ➕ Lưu công thức
        </button>

    </form>

</div>
