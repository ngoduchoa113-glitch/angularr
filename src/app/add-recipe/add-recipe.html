<a mat-button routerLink="/recipes" class="back-link">
    <mat-icon>arrow_back</mat-icon>
    Quay lại danh sách
</a>

<mat-card class="form-card">

    <mat-card-header>

        <span class="eyebrow">Bộ sưu tập công thức</span>

        <mat-card-title>
            Thêm công thức mới
        </mat-card-title>

    </mat-card-header>

    <mat-card-content>

        <form [formGroup]="recipeForm" (ngSubmit)="save()" class="recipe-form">

            <mat-form-field appearance="outline">

                <mat-label>Tên món</mat-label>

                <input matInput type="text" formControlName="name">

            </mat-form-field>

            <mat-form-field appearance="outline">

                <mat-label>Giá</mat-label>

                <input matInput type="number" formControlName="price">

            </mat-form-field>

            <mat-form-field appearance="outline">

                <mat-label>Mô tả</mat-label>

                <textarea matInput rows="4" formControlName="description">
                </textarea>

            </mat-form-field>

            <mat-form-field appearance="outline">

                <mat-label>Nguyên liệu</mat-label>

                <textarea matInput rows="3" formControlName="ingredients">
                </textarea>

            </mat-form-field>

            <mat-form-field appearance="outline">

                <mat-label>Hình ảnh</mat-label>

                <input matInput formControlName="imgUrl">

                <mat-hint>
                    Không bắt buộc
                </mat-hint>

            </mat-form-field>

            <button mat-filled-button type="submit">

                <mat-icon>save</mat-icon>

                Lưu công thức

            </button>

        </form>

    </mat-card-content>

</mat-card>
