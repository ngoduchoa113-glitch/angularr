<mat-toolbar class="app-toolbar">

    <button mat-icon-button type="button" aria-label="Mở/đóng menu" (click)="sidenavOpened.set(!sidenavOpened())">
        <mat-icon>menu</mat-icon>
    </button>

    <a routerLink="/recipes" class="app-logo-link" aria-label="Về trang danh sách món ăn">
        <img src="https://th.bing.com/th?q=Meo+%c4%90en+Cartoon&w=120&h=120&c=1&rs=1&qlt=70&r=0&o=7&cb=1&dpr=1.9&pid=InlineBlock&rm=3&mkt=en-WW&cc=VN&setlang=en&adlt=moderate&t=1&mw=247"
            alt="Logo" class="app-logo">
    </a>

    <span class="app-title">Midnight Cat Restaurant</span>

    <span class="app-toolbar-spacer"></span>

    <button mat-icon-button type="button" class="theme-toggle"
        [attr.aria-label]="themeStore.mode() === 'dark' ? 'Chuyển sang chế độ sáng' : 'Chuyển sang chế độ tối'"
        (click)="themeStore.toggle()">
        <mat-icon>{{ themeStore.mode() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>

</mat-toolbar>

<mat-sidenav-container class="app-body">

    <mat-sidenav class="app-drawer" [mode]="sidenavMode()" [opened]="sidenavOpened()"
        (openedChange)="sidenavOpened.set($event)">

        <mat-nav-list>

            <a mat-list-item routerLink="/recipes" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">
                <mat-icon matListItemIcon>restaurant_menu</mat-icon>
                <span matListItemTitle>Tất cả món</span>
            </a>

            <a mat-list-item routerLink="/recipes/new" routerLinkActive="active-link">
                <mat-icon matListItemIcon>add</mat-icon>
                <span matListItemTitle>Thêm món</span>
            </a>

        </mat-nav-list>

    </mat-sidenav>

    <mat-sidenav-content class="app-content">

        <router-outlet />

        <a mat-fab class="app-fab" routerLink="/recipes/new" aria-label="Thêm món">
            <mat-icon>add</mat-icon>
        </a>

    </mat-sidenav-content>

</mat-sidenav-container>
